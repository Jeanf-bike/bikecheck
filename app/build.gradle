plugins {
    id 'com.android.application'
}

android {
    namespace 'nl.bikecheck'
    compileSdk 34

    defaultConfig {
        applicationId "nl.bikecheck"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "3.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // De app toont web/bikecheck.html — altijd de actuele versie meenemen
    sourceSets {
        main.assets.srcDirs += "$buildDir/generated/webassets"
    }
}

tasks.register('kopieerWeb', Copy) {
    from("$rootDir/web") { include 'bikecheck.html' }
    into "$buildDir/generated/webassets"
}
preBuild.dependsOn kopieerWeb
